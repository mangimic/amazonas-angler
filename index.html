<meta charset="utf-8">
<title>Amazonas Angler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Vollbild-3D-Welt, darüber dicke "Aufkleber"-Bedienelemente für Kinderhände */
:root{
  --leaf:#123323;      /* dunkles Urwaldgrün, Panels */
  --leaf-2:#1f4d32;
  --river:#3c8f86;
  --mud:#b88a4a;
  --macaw:#e2412b;     /* Ara-Rot, Akzent */
  --gold:#f6c13b;      /* Ludins */
  --paper:#fbf3df;
  --ink:#1b2a20;
  --muted:#5d6b5f;
  /* Nur Schriften, die schon auf dem Gerät sind (keine Google-Schriften: so gehen keine Daten an andere) */
  --display:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:#9fd6c8;color:var(--ink)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
.topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.topbar>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 6px;
  box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,var(--gold) 55%,#c88a12);border:2px solid #8a5a07;
  display:grid;place-items:center;font-size:15px;color:#7a4b00;flex:none}
.pill small{font-size:14px;color:var(--muted);font-weight:600}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.15)}}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;box-shadow:0 4px 0 var(--ink);
  font-family:var(--display);font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px}
.chip:active,.act:active,.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spacer{flex:1}
.name{font-family:var(--display);font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.4);padding:0 4px}

.sonar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 140px);width:min(240px,34vw);
  border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);background:#0b2230;pointer-events:none;overflow:hidden}
.sonar canvas{display:block;width:100%;height:auto}
.minimap{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);width:136px;height:136px;padding:0;
  border:4px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink);background:#6a9a4a;overflow:visible}
.minimap canvas{display:block;width:100%;height:100%;border-radius:50%}
.minimap span{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:0 10px;font:800 14px/1.5 var(--display);color:var(--ink)}
.minimap:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
@media (max-width:720px){.minimap{width:104px;height:104px}}
.card.mapcard{width:min(1040px,100%)}
.mapwrap{position:relative;flex-shrink:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#6a9a4a}
.maprow{flex-shrink:0}
.mapwrap canvas{display:block;width:100%;height:auto}
.maprow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.maprow>.mapwrap{flex:0 0 auto;width:min(260px,100%)}
.maplegend{flex:1 1 220px;min-width:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;font-weight:700}
.maplegend span{white-space:nowrap}
.maphead{margin:0;font:800 18px var(--display)}
#btnNews{position:relative}
.newsdot{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--macaw);border:2px solid var(--ink)}
.news{display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.newsday{margin:4px 0 0;font:800 16px var(--display);color:var(--muted)}
.newsitem{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;background:#f3e8cc;border-radius:14px;padding:10px 12px}
.newsitem.fresh{background:#fff3c4;box-shadow:inset 0 0 0 3px var(--gold)}
.newsitem .ni{font-size:34px;line-height:1.1;text-align:center}
.newsitem b{display:block;font:800 18px/1.2 var(--display)}
.newsitem span{display:block;font-size:15px;line-height:1.4;margin-top:2px}
.newsver{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sonar b{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;font:800 15px/1.6 var(--display);text-align:center}
.sonar.ping{animation:bump .5s}
#build .btop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;pointer-events:none}
#build .btop>*{pointer-events:auto}
#build .bbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;
  background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tool{min-width:78px;min-height:64px;border:3px solid var(--ink);border-radius:14px;background:#e9dfc5;font:800 15px/1.1 var(--display);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px}
.tool .i{font-size:26px;line-height:1.1}
.tool small{font:700 12px var(--body);color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--gold);box-shadow:inset 0 0 0 3px var(--ink)}
.wcols{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wcols button{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink)}
.wcols button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);max-width:min(560px,calc(100% - 32px));
  background:rgba(18,51,35,.88);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:16px;text-align:center;pointer-events:none;text-wrap:balance}

.actions{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.act{border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);font-family:var(--display);font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px}
.fish{width:132px;height:132px;border-radius:50%;flex-direction:column;gap:0;background:var(--river);color:#fff;font-size:22px;line-height:1}
.fish .ico{font-size:44px;line-height:1.1}
.fish.wait{background:#2b6b65}
.fish.bite{background:var(--macaw);animation:pulse .35s infinite alternate;font-size:26px}
@keyframes pulse{to{transform:scale(1.1)}}
.ctx{background:var(--gold);padding:12px 20px;font-size:22px}
.baitbtn{background:var(--paper);min-height:60px;padding:8px 18px;font-size:20px}
.hint-joy{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  width:120px;height:120px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);display:grid;place-items:center;color:#fff;font-weight:800;
  text-align:center;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
#joyBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.7);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}

/* ---------- Avatar-Werkstatt ---------- */
#creator{position:fixed;top:0;bottom:0;right:0;width:min(410px,100%);background:var(--leaf);color:#fff;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) 22px;
  display:flex;flex-direction:column;gap:14px;border-left:4px solid var(--ink)}
.brand{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--gold);text-shadow:0 3px 0 var(--ink)}
.brand small{display:block;font-size:17px;color:#cfe6d6;text-shadow:none;margin-top:4px;font-weight:600}
.row{display:flex;flex-direction:column;gap:6px}
.row label,.lbl{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#a9cdb5}
#nameIn{font:800 22px var(--display);padding:8px 12px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.3)}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--leaf-2);border:3px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 14px;font-weight:800;font-size:16px;color:#fff}
.opts button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.big{background:var(--macaw);color:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);font:800 26px var(--display);padding:10px 18px;margin-top:6px}
.small-note{font-size:13px;color:#a9cdb5}
@media (max-width:720px) and (orientation:portrait){
  #creator{top:auto;height:56%;width:100%;border-left:0;border-top:4px solid var(--ink);border-radius:22px 22px 0 0;box-sizing:border-box}
  .brand{font-size:28px}
}

/* ---------- Fenster ---------- */
#modal{position:fixed;inset:0;background:rgba(10,30,20,.55);display:grid;place-items:center;padding:16px}
.card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);
  width:min(560px,100%);max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  padding:18px 18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card h2{font:800 28px/1.05 var(--display);margin:0;text-wrap:balance}
.card p{margin:0;font-size:17px;line-height:1.4}
.bookhead{margin:6px 0 0;font:800 20px var(--display)}
.bookhead span{font:700 14px var(--body);color:var(--muted)}
.catch{align-items:center;text-align:center}
.badge{display:inline-block;background:var(--macaw);color:#fff;font:800 15px var(--display);padding:2px 12px;border-radius:999px;transform:rotate(-3deg)}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stat{background:#efe4c6;border-radius:12px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.b{border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:9px 16px;min-height:60px;font:800 19px var(--display);background:var(--gold)}
.b.alt{background:#e9dfc5}
.b.go{background:#5fb36a;color:#fff}
.b:disabled{opacity:.5;cursor:default}
.b:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;border:3px solid var(--ink);border-radius:12px;padding:6px;font:800 18px var(--display);background:#e9dfc5}
.tabs button[aria-pressed="true"]{background:var(--river);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;background:#f3e8cc;border-radius:14px;padding:8px}
.item .thumb{width:72px;height:54px;object-fit:cover;border-radius:10px;border:2px solid var(--ink);box-sizing:border-box;font-size:28px}
.item .t{min-width:0}
.item b{font:800 18px var(--display);display:block;line-height:1.1}
.item span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.shopitem{grid-template-columns:56px 1fr auto}
.shopicon{width:56px;height:56px;border-radius:14px;background:var(--river);display:grid;place-items:center;font-size:30px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bk{background:#f3e8cc;border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.bk .bkimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;font-size:34px}
.bk .unknown{background:#2c4537;color:#cfe6d6;font:800 40px var(--display)}
.bk b{font:800 15px/1.1 var(--display)}
.bk span{font-size:12px;color:var(--muted)}
button.bk{font:inherit;color:inherit;border:3px solid transparent;cursor:pointer}
button.bk:active{border-color:var(--ink)}
.pic{width:min(320px,100%);margin:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.pic .photo{aspect-ratio:4/3;font-size:64px;width:100%;height:auto;border-radius:16px;border:3px solid var(--ink);background:radial-gradient(ellipse at center,#d6efe6,#a9d6c9)}
.pic img{object-fit:cover}
.nofoto{display:grid;place-items:center;background:#cfe6d6;box-sizing:border-box}
.pic figcaption{font-size:12px;color:var(--muted);line-height:1.3}
.pic figcaption a{color:inherit}
.rosa{display:flex;gap:12px;align-items:center}
.btns.col{flex-direction:column;align-items:stretch}
.saveok{font-weight:800}
.card .err{color:#a32d2d;font-weight:700}
.player{width:100%;font:inherit;color:inherit;text-align:left;border:3px solid transparent;cursor:pointer;min-height:72px}
.player.me{border-color:var(--gold)}
.player .sum{font:800 15px var(--display);color:var(--muted)}
.pface{width:56px;height:56px;border-radius:50%;border:6px solid;box-sizing:border-box;justify-self:center}
.rosa .face{width:54px;height:54px;flex:none;border-radius:50%;background:#8d5524;border:3px solid var(--ink);position:relative}
.rosa .face::before,.rosa .face::after{content:"";position:absolute;top:20px;width:7px;height:7px;border-radius:50%;background:#1a1a1a}
.rosa .face::before{left:14px}.rosa .face::after{right:14px}
.rosa .face.tiago{background:#c98b5e}
.rosa .face .beard{position:absolute;left:7px;right:7px;bottom:-5px;height:22px;background:#f3f3f3;border:3px solid var(--ink);border-top:none;border-radius:0 0 22px 22px}
.tabs.four button{font-size:16px;padding:6px 2px}
.havecount{font-weight:800;color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:14px;font-weight:700}
.sum{font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;
  background:var(--ink);color:#fff;font-weight:800;font-size:18px;padding:10px 18px;border-radius:14px;max-width:min(480px,calc(100% - 40px));text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#flight{position:fixed;inset:0;display:grid;place-items:center;background:var(--river);color:#fff;font:800 30px var(--display);z-index:20;animation:flyin .35s}
#flight div{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#flight span{font-size:72px;animation:flyby 1.8s linear}
@keyframes flyin{from{opacity:0}}
@keyframes flyby{from{transform:translateX(-40vw)}to{transform:translateX(40vw)}}
@media (prefers-reduced-motion:reduce){#flight span{animation:none}}
#timeup{position:fixed;inset:0;z-index:50;background:rgba(10,30,20,.85);display:grid;place-items:center;padding:16px}
.timechip{pointer-events:none}
.timechip.low{background:#ffd9c9}
.gate input{font:800 26px var(--display);width:120px;padding:8px;border:3px solid var(--ink);border-radius:12px;text-align:center}
.rank .place{font:800 22px var(--display);width:40px;text-align:center}
.rankrow{display:grid;grid-template-columns:40px 56px 1fr auto;gap:10px;align-items:center;width:100%;min-height:68px;background:#f3e8cc;border-radius:14px;padding:6px 10px;border:3px solid transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;box-sizing:border-box}
.rankrow.me{border-color:var(--gold)}
.rankrow b{font:800 18px var(--display);display:block;line-height:1.1}
.rankrow span{font-size:13px;color:var(--muted)}
.rankrow .val{font:800 18px var(--display);color:var(--ink);text-align:right}
.catches{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.catches div{background:#f3e8cc;border-radius:12px;padding:6px;text-align:center;font-size:13px}
.catches img,.catches .nofoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;font-size:28px}
.rule{background:#ffe9c2;border:3px solid #d98a2e;border-radius:14px;padding:10px 12px;text-align:left}
.rule b{font:800 20px var(--display)}.rule p{margin:4px 0}.rule small{color:var(--muted)}
.tipline{background:#e3f1ea;border-radius:12px;padding:8px 12px;font-size:16px}
.card .small{font-size:14px;color:var(--muted)}
.quiz .qq{font:800 22px/1.25 var(--display)}
.quiz .qa{text-align:left;font-size:18px}
.quiz .qa.right{background:#5fb36a;color:#fff}
.quiz .qa.wrong{background:#f3b3a6}
.quiz .qe{background:#e3f1ea;border-radius:12px;padding:8px 12px}
.schein{border:4px double var(--ink);border-radius:18px;background:#fff6dc;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px}
.schein .sico{font-size:54px}.schein b{font:800 26px var(--display)}.schein span{font:800 18px var(--display);color:var(--muted)}
.mycard{width:min(320px,100%);border-radius:18px;box-shadow:0 6px 0 var(--ink)}
.info .infohead{background:#2f7fd8;color:#fff;font:800 16px var(--display);padding:4px 12px;border-radius:999px;align-self:flex-start}
table.rules{border-collapse:collapse;width:100%;font-size:16px}
.stampbig{font-size:72px;line-height:1}
.flylist{flex:1 1 230px;min-width:0;display:flex;flex-direction:column;gap:8px}
.flylist .b{text-align:left}
.flylist span{font-size:15px;font-weight:700}
#deMap{cursor:pointer}
table.rules th,table.rules td{border-bottom:2px solid #e9dfc5;padding:6px 4px;text-align:left}
table.rules tr.now td{background:#ffe9c2}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--leaf);color:var(--gold);font:800 30px var(--display)}
@media (prefers-reduced-motion:reduce){.fish.bite{animation:none}.pill.bump{animation:none}}
</style>

<div id="stage"></div>
<div id="loading">Der Urwald wächst …</div>

<div id="hud" hidden>
  <div class="topbar">
    <div class="pill" id="pillLudins"><span class="coin">L</span><span class="sum" id="hudLudins">0</span><small>Ludins</small></div>
    <button class="chip" id="btnBucket" aria-label="Eimer anschauen">🪣 <span class="sum" id="hudBucket">0/15</span></button>
    <button class="chip" id="btnBook">📖 Fischbuch</button>
    <button class="chip" id="btnRank" aria-label="Bestenliste">🏆</button>
    <span class="chip timechip" id="timeChip" hidden></span>
    <button class="chip" id="btnNews">✨ Neu<span class="newsdot" id="newsDot" hidden></span></button>
    <span class="spacer"></span>
    <span class="name" id="hudName"></span>
    <button class="chip" id="btnAvatar" aria-label="Avatar ändern">👕</button>
  </div>
  <div class="tip" id="tip" hidden></div>
  <button class="minimap" id="btnMap" aria-label="Große Karte öffnen"><canvas id="miniCv"></canvas><span>Karte</span></button>

/* ---- Welt in Stücken: Boden, Bäume, Büsche, Blumen, Seerosen ----
   Der Fluss ist über 2 km lang. Damit das iPad flüssig bleibt, baut das Spiel nur die Stücke in deiner Nähe. */
const CHUNK=160,CHUNKS=Math.ceil((Z_MAX-Z_MIN)/CHUNK),chunks={};
const chunkOf=z=>Math.floor((z-Z_MIN)/CHUNK);
const GREENS=['#3d7a35','#467f2f','#356d33','#55893a'],FLOWER_COLS=['#e2412b','#f6c13b','#ef6fa5','#ffffff','#8e44c4'];
const padGeo=merge([part(new THREE.CylinderGeometry(1,1,0.06,14),'#4f8a3a'),part(new THREE.CylinderGeometry(1.04,1.04,0.18,14,1,true),'#8a3f3a',M(0,0.05,0))]);
const bushGeo=merge([part(new THREE.IcosahedronGeometry(1,0),'#3f8236')]),flowerGeo=new THREE.SphereGeometry(0.16,6,5),flowerMat=new THREE.MeshLambertMaterial();
// Ein Stück wird in kleinen Schritten gebaut (yield = Pause bis zum nächsten Bild), damit das Spiel nicht ruckelt
function* chunkSteps(k,g,cols){
  const z0=Z_MIN+k*CHUNK,R=rng(1000+k*7919);
  const rx=()=>(R()*2-1)*BOUND,rz=()=>z0+R()*CHUNK;
  // Boden in 4 Streifen
  for(let strip=0;strip<4;strip++){
  const tg=new THREE.PlaneGeometry(WORLD,CHUNK/4,150,25);tg.rotateX(-Math.PI/2);tg.translate(0,0,z0+CHUNK/8+strip*CHUNK/4);
  const tp=tg.attributes.position;
  for(let i=0;i<tp.count;i++)tp.setY(i,heightAt(tp.getX(i),tp.getZ(i)));
  const tgn=tg.toNonIndexed();tg.dispose();tgn.computeVertexNormals();
  const P=tgn.attributes.position,tc=new Float32Array(P.count*3),c=new THREE.Color();
  for(let i=0;i<P.count;i+=3){
    const cx=(P.getX(i)+P.getX(i+1)+P.getX(i+2))/3,cy=(P.getY(i)+P.getY(i+1)+P.getY(i+2))/3,cz=(P.getZ(i)+P.getZ(i+1)+P.getZ(i+2))/3;
    const n=hash(Math.round(cx*3),Math.round(cz*3)),dv=Math.hypot(cx-VX,cz-VZ);
    let col;
    if(cy<-0.4)col='#5c5034';
    else if(cy<0.45)col=n<.5?'#c79d5f':'#bb9154';
    else if(dv<8||(Math.abs(cz)<1.6&&cx>DOCK.x1-4&&cx<VX))col=n<.5?'#b48f5a':'#a8834f';
    else col=GREENS[Math.floor(n*4)];
    c.set(col);
    for(let q=0;q<3;q++){tc[(i+q)*3]=c.r;tc[(i+q)*3+1]=c.g;tc[(i+q)*3+2]=c.b;}
  }
  tgn.setAttribute('color',new THREE.BufferAttribute(tc,3));
  const ground=new THREE.Mesh(tgn,vcMat);ground.userData.own=true;g.add(ground);
  yield;}
  // Bäume
  const trees=[[],[],[]];
  for(let i=0;i<2700&&trees[0].length+trees[1].length+trees[2].length<290;i++){
    const x=rx(),z=rz(),h=heightAt(x,z);
    if(h<0.8)continue;
    if(Math.hypot(x-VX,z-VZ)<14||nearPlot(x,z,3))continue;
    if(Math.abs(z)<4&&x>DOCK.x0-2&&x<VX+6)continue;
    let ok=true;for(const o of cols){if((o.x-x)**2+(o.z-z)**2<9){ok=false;break;}}
    if(!ok)continue;
    const d=Math.abs(x-riverX(z));
    const type=d<20+riverHalf(z)-RIVER_HALF&&R()<0.5?1:(R()<0.6?0:2);
    const sc=0.8+R()*0.6;
    trees[type].push(M(x,h-0.2,z,0,R()*6.28,0,sc,sc*(0.9+R()*0.3),sc));
    cols.push({x,z,r:(type===1?0.4:0.65)*sc});
  }
  [treeA,treeB,treeC].forEach((tg2,i)=>{const im=new THREE.InstancedMesh(tg2,vcMat,trees[i].length);trees[i].forEach((m,q)=>im.setMatrixAt(q,m));g.add(im);});
  yield;
  // Büsche und Blumen
  const bushes=[];
  for(let i=0;i<3400&&bushes.length<350;i++){const x=rx(),z=rz(),h=heightAt(x,z);
    if(h<0.4||Math.hypot(x-VX,z-VZ)<9||nearPlot(x,z,1.5)||(Math.abs(z)<2.5&&x>DOCK.x1-4&&x<VX))continue;const sc=0.5+R()*0.9;bushes.push(M(x,h,z,0,R()*6,0,sc,sc*0.7,sc));}
  const bm=new THREE.InstancedMesh(bushGeo,vcMat,bushes.length);bushes.forEach((m,q)=>bm.setMatrixAt(q,m));g.add(bm);
  const fm=new THREE.InstancedMesh(flowerGeo,flowerMat,280);let n=0;const fc=new THREE.Color();
  for(let i=0;i<3400&&n<280;i++){const x=rx(),z=rz(),h=heightAt(x,z);if(h<0.5)continue;
    fm.setMatrixAt(n,M(x,h+0.25,z));fm.setColorAt(n,fc.set(FLOWER_COLS[Math.floor(R()*5)]));n++;}
  fm.count=n;g.add(fm);
  yield;
  // Riesenseerosen am Rand des Flusses (nicht in Stromschnellen)
  const pads=[];
  for(let i=0;i<2000&&pads.length<40;i++){const z=rz(),side=R()<.5?-1:1,x=riverX(z)+side*(riverHalf(z)-5+R()*3),h=heightAt(x,z);
    if(h>-0.6||Math.abs(x)>BOUND||nearPlot(x,z,2.5)||rapidAt(x,z)>0)continue;if(Math.abs(z)<5&&x>DOCK.x0-4)continue;const sc=0.8+R()*0.9;pads.push(M(x,0.05,z,0,R()*6,0,sc,1,sc));}
  const pm=new THREE.InstancedMesh(padGeo,vcMat,pads.length);pads.forEach((m,q)=>pm.setMatrixAt(q,m));g.add(pm);
}
function buildChunk(k){const g=new THREE.Group(),cols=[];scene.add(g);chunks[k]={g,cols,steps:chunkSteps(k,g,cols)};}
function dropChunk(k){const ch=chunks[k];scene.remove(ch.g);
  ch.g.children.forEach(o=>{if(o.userData.own)o.geometry.dispose();if(o.isInstancedMesh&&o.dispose)o.dispose();});delete chunks[k];}
// Stücke um z herum bauen (eins pro Bild, damit nichts ruckelt; „alle“ baut sofort alle nötigen)
function updateChunks(z,alle){const k=chunkOf(z);
  for(const key in chunks)if(Math.abs(key-k)>2)dropChunk(+key);
  // das eigene Stück zuerst, dann die Nachbarn
  for(const i of[k,k+1,k-1]){if(i<0||i>=CHUNKS)continue;if(!chunks[i])buildChunk(i);const ch=chunks[i];
    if(ch.steps){if(alle){while(!ch.steps.next().done);ch.steps=null;}else{if(ch.steps.next().done)ch.steps=null;return;}}}}

const inBounds=(x,z)=>(Math.abs(x)<BOUND&&z>Z_MIN+8&&z<Z_MAX-8)||(Math.abs(x-LAKE.x)<LAKE.w&&Math.abs(z-LAKE.z)<LAKE.l)||
  (!!deP&&Math.abs(x)<DE.w-6&&Math.abs(z-DE.z)<DE.l-6);
function hitsList(list,x,z,r){for(const c of list){const rr=c.r+r;if((c.x-x)**2+(c.z-z)**2<rr*rr)return true;}return false;}
function hitsCollider(x,z,r){if(hitsList(colliders,x,z,r))return true;if(z<DE.zone)return hitsList(deCols,x,z,r);const k=chunkOf(z);
  for(let i=k-1;i<=k+1;i++){const ch=chunks[i];if(ch&&hitsList(ch.cols,x,z,r))return true;}return false;}
function hitsWall(x,z,r){for(const s of houseSegs){const dx=s.bx-s.ax,dz=s.bz-s.az,l=dx*dx+dz*dz;
    const k=Math.max(0,Math.min(1,((x-s.ax)*dx+(z-s.az)*dz)/l));if((s.ax+dx*k-x)**2+(s.az+dz*k-z)**2<r*r)return true;}return false;}
const walkable=(x,z)=>inBounds(x,z)&&(onDock(x,z)||onPlot(x,z)||heightAt(x,z)>0.15)&&!hitsCollider(x,z,0.35)&&!hitsWall(x,z,0.33);
const nearDock=(x,z)=>x>DOCK.x0-1.6&&x<DOCK.x1+1&&z>DOCK.z0-1.8&&z<DOCK.z1+1.8;
const boatable=(x,z)=>inBounds(x,z)&&heightAt(x,z)<-0.6&&!nearDock(x,z)&&!nearPlot(x,z,1.8)&&!hitsRock(x,z);
function groundY(x,z){const h=heightAt(x,z);return onDock(x,z)?Math.max(h,DOCK.y):onPlot(x,z)?Math.max(h,PLOT.y):h;}
function angleLerp(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;}

function updatePlayer(dt,t){
  let jx=input.jx,jy=input.jy;const k=input.keys;
  if(k.KeyW||k.ArrowUp)jy-=1;if(k.KeyS||k.ArrowDown)jy+=1;if(k.KeyA||k.ArrowLeft)jx-=1;if(k.KeyD||k.ArrowRight)jx+=1;
  const mag=Math.min(1,Math.hypot(jx,jy));
  let moving=false;
  if(mag>0.12){
    if(fishing.state!=='idle')stopFishing();
    const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
    let mx=fx*(-jy)+rx*jx,mz=fz*(-jy)+rz*jx;const ml=Math.hypot(mx,mz)||1;mx/=ml;mz/=ml;
    const target=Math.atan2(mx,mz);
    player.facing=angleLerp(player.facing,target,1-Math.exp(-dt*(player.inBoat?(state.hasYacht?YACHT.turn:state.hasMotor?5:4):12)));
    const sp=(player.inBoat?(state.hasYacht?YACHT.speed:state.hasMotor?18:9):5.5)*mag*dt;
    // Die Yacht ist lang: auch der Bug (vorne) muss im tiefen Wasser bleiben
    const yachtOk=(x,z)=>boatable(x,z)&&boatable(x+Math.sin(player.facing)*YACHT.len,z+Math.cos(player.facing)*YACHT.len);
    const ok=player.inBoat?(state.hasYacht?yachtOk:boatable):walkable;
    let dx=mx*sp,dz=mz*sp;
    if(player.inBoat){dx=Math.sin(player.facing)*sp;dz=Math.cos(player.facing)*sp;}
    const p=player.pos;
    if(ok(p.x+dx,p.z+dz)){p.x+=dx;p.z+=dz;moving=true;}
    else if(ok(p.x+dx,p.z)){p.x+=dx;moving=true;}
    else if(ok(p.x,p.z+dz)){p.z+=dz;moving=true;}
  }
  if(player.inBoat){const rp=rapidAt(player.pos.x,player.pos.z);
    if(rp>0){const dir=downstream(player.pos.z),push=6*rp*dt,nx=player.pos.x+dir.x*push,nz=player.pos.z+dir.z*push;
      if(boatable(nx,nz)){player.pos.x=nx;player.pos.z=nz;}
      if(!state.sawRapids){state.sawRapids=true;save();toast('Stromschnellen! Das schnelle Wasser schiebt dein Boot. Mit Motor kommst du leichter hindurch.');}}}
  player.speed=moving?mag:0;
  const av=player.av;
  if(player.inBoat){
    boat.pos.copy(player.pos);boat.yaw=player.facing;
    const by=BOAT_Y+Math.sin(t*2)*0.05;
    if(state.hasYacht){player.y=by+YACHT_DECK;av.legs.forEach(l=>l.rotation.x=0); // auf der Yacht steht man am Steuer
      if(fishing.state==='idle')av.arms.forEach(a=>a.rotation.x=-0.7);}
    else{player.y=by-0.4;av.legs.forEach(l=>l.rotation.x=-1.45);
    if(fishing.state==='idle')av.arms.forEach((a,i)=>a.rotation.x=state.hasMotor?-0.6:Math.sin(t*3+i*Math.PI)*0.5*(moving?1:0.1));}
  }else{
    const gy=groundY(player.pos.x,player.pos.z);player.y+=(gy-player.y)*Math.min(1,dt*14);
    player.walk+=dt*(moving?11*mag:0);
    const sw=moving?Math.sin(player.walk)*0.7:0;
    av.legs[0].rotation.x+=(sw-av.legs[0].rotation.x)*0.3;av.legs[1].rotation.x+=(-sw-av.legs[1].rotation.x)*0.3;
    if(fishing.state==='idle'){av.arms[0].rotation.x+=(-sw-av.arms[0].rotation.x)*0.3;av.arms[1].rotation.x+=(sw-av.arms[1].rotation.x)*0.3;}
  }
  player.root.position.set(player.pos.x,player.y,player.pos.z);
  player.root.rotation.y=player.facing;
  blob.visible=!player.inBoat;blob.position.set(player.pos.x,groundY(player.pos.x,player.pos.z)+0.03,player.pos.z);
}

      if(m==='grund')bite*=1.3;

  }else if(fishing.state==='wait'){
    av.rod.rotation.x=0.93;
    if(m==='spin'){ // der Kunstköder kommt langsam zum Ufer zurück
      const k=Math.min(1,fishing.t/fishing.retr)*0.8;
      bb.position.set(fishing.target.x+(fishing.from.x-fishing.target.x)*k,0.02,fishing.target.z+(fishing.from.z-fishing.target.z)*k);
      bb.rotation.y=Math.atan2(fishing.from.x-fishing.target.x,fishing.from.z-fishing.target.z);bb.rotation.z=t*12;
      av.rod.rotation.x=0.93+Math.sin(t*10)*0.03;
      if(fishing.t>=fishing.retr&&fishing.t<fishing.biteAt){stopFishing();toast('Nichts gebissen. Wirf den Kunstköder noch einmal aus!');return;}}
    else if(m==='grund'){bb.position.set(fishing.target.x,-0.45,fishing.target.z);}
    else{bb.position.copy(fishing.target);bb.position.y=0.05+Math.sin(t*3)*0.03;}
    if(fishing.t>fishing.biteAt){fishing.state='bite';fishing.t=0;fishing.win=rodNow().win*(m==='grund'?1.4:1);updateFishBtn();
      if(m==='grund'){tone(1320,0.08,'square',0.08);tone(1320,0.08,'square',0.08,0.15);tone(1320,0.08,'square',0.08,0.3);} // der Bissanzeiger piept
      else{sfxBite();splash(bb.position.x,bb.position.z);}
      if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}}
  }else if(fishing.state==='bite'){
    av.rod.rotation.x=0.93+Math.sin(t*30)*(m==='grund'?0.09:0.05);
    if(m==='pose'){bb.position.copy(fishing.target);bb.position.y=-0.12*Math.abs(Math.sin(fishing.t*16));}
    else if(m==='spin')bb.position.y=-0.05*Math.abs(Math.sin(fishing.t*20));

  }

  av.tip.getWorldPosition(tipW);line.visible=bb.visible;
  if(line.visible){const a=lineGeo.attributes.position.array,b=bb.position;
    for(let i=0;i<LINE_N;i++){const s=i/(LINE_N-1);a[i*3]=tipW.x+(b.x-tipW.x)*s;a[i*3+2]=tipW.z+(b.z-tipW.z)*s;
      a[i*3+1]=tipW.y+(b.y+0.1-tipW.y)*s-Math.sin(s*Math.PI)*(fishing.state==='bite'||m!=='pose'?0.1:0.5);}
    lineGeo.attributes.position.needsUpdate=true;}
}
function chooseFish(){
  const here=atDE()?'fluss':atLake()?'see':'amazonas';
  const pool=here==='fluss'&&curSpot?curSpot.fish.map(id=>FISH_BY[id]).filter(Boolean):FISH.filter(f=>fishHome(f)===here&&(!f.boat||player.inBoat));
  const sc=schoolAt(fishing.target.x,fishing.target.z);
  const bt=BAITS[fishing.bait]||BAITS.wurm;
  const me=METHODS[fishing.method]||METHODS.pose;
  const wt=f=>{let w=f.w;if(f.price>=40)w*=rodNow().rare;if(bt.like.includes(f.id))w*=bt.x;
    if(me.like.includes(f.id))w*=3;if(me.no.includes(f.id))w*=0.15;if(fishing.method==='grund'&&f.price>=40)w*=1.5;if(player.inBoat&&f.price>=40)w*=1.5;
    if(sc&&f.price>=40)w*=2;if(f.id==='dorado'&&rapidAt(fishing.target.x,fishing.target.z)>0.2)w*=5;if(sc&&sc.big&&f.boat)w*=3;return w;};
  let sum=0;pool.forEach(f=>sum+=wt(f));let r=Math.random()*sum;
  for(const f of pool){r-=wt(f);if(r<=0)return f;}return pool[0];
}
function catchFish(){
  const f=chooseFish();const k=Math.random();
  const cm=Math.round(f.cm[0]+(f.cm[1]-f.cm[0])*k);const value=Math.max(1,Math.round(f.price*(0.85+k*0.4)));
  const sc=schoolAt(fishing.target.x,fishing.target.z);if(sc&&--sc.n<=0)placeSchool(sc);
  const isNew=!state.book[f.id];
  const b=state.book[f.id]||{n:0,best:0};b.n++;b.best=Math.max(b.best,cm);state.book[f.id]=b;
  // Am Flussplatz: neue Fischart für den Fluss-Stempel
  let extra=null;if(atDE()&&curSpot){const p=prog(curSpot.id);
    if(!p.f.includes(f.id)){p.f.push(f.id);if(!p.s)extra='🏅 Neue Fischart hier: '+Math.min(p.f.length,STAMP_FISH)+' von '+STAMP_FISH+' für den Fluss-Stempel.'+(p.f.length>=STAMP_FISH&&!p.q?' Jetzt noch das Rätsel an der Infotafel!':'');}
    const res=tryStamp(curSpot.id);if(res)pendingStamp={s:curSpot,res};}
  save();
  splash(fishing.target.x,fishing.target.z,true);sfxSplash();sfxCatch();
  stopFishing();
  showCatch(f,cm,value,isNew,extra);
}

function updateSonar(dt){
  const on=mode==='play'&&player.inBoat&&state.hasSonar;$('#sonar').hidden=!on;if(!on){sonar.last=null;return;}
  sonar.tick+=dt;if(sonar.tick<0.06)return;sonar.tick=0;
  const x=player.pos.x,z=player.pos.z,depth=Math.max(0,-heightAt(x,z)),sc=schoolAt(x,z);
  sonar.cols.push(depth);if(sonar.cols.length>SW/2)sonar.cols.shift();
  sonar.blips.forEach(b=>b.x-=2);sonar.blips=sonar.blips.filter(b=>b.x>-20);
  if(sc&&Math.random()<0.35)sonar.blips.push({x:SW+8,d:0.4+Math.random()*Math.max(0.2,depth-0.8),big:sc.big&&Math.random()<0.5});
  else if(!sc&&depth>0.6&&Math.random()<0.03)sonar.blips.push({x:SW+8,d:0.3+Math.random()*(depth-0.5),big:false});
  // Zeichnen: Wasser, Boden, Fische
  const g=sctx.createLinearGradient(0,0,0,SH);g.addColorStop(0,'#1d5b78');g.addColorStop(1,'#0b2230');sctx.fillStyle=g;sctx.fillRect(0,0,SW,SH);
  sctx.fillStyle='#d98a2e';sctx.beginPath();sctx.moveTo(SW,SH);
  for(let i=sonar.cols.length-1;i>=0;i--)sctx.lineTo(SW-(sonar.cols.length-1-i)*2,sonarY(sonar.cols[i]));
  sctx.lineTo(SW-(sonar.cols.length-1)*2,SH);sctx.closePath();sctx.fill();
  sctx.lineWidth=3;sctx.lineCap='round';
  sonar.blips.forEach(b=>{const r=b.big?13:6;sctx.strokeStyle=b.big?'#ff5a3c':'#ffe066';sctx.beginPath();sctx.arc(b.x,sonarY(b.d)+r*0.6,r,Math.PI*1.15,Math.PI*1.85);sctx.stroke();});
  sctx.fillStyle='#fff';sctx.font='800 16px ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif';sctx.fillText(depth.toFixed(1).replace('.',',')+' m tief',8,20);
  const key=sc?(sc.big?'big':'school'):'none';
  if(key!==sonar.last){if(sonar.last!==null&&key!=='none'){sfxPing(sc.big);const e=$('#sonar');e.classList.remove('ping');void e.offsetWidth;e.classList.add('ping');}
    if(key!=='none'&&!state.sonarFound){state.sonarFound=true;save();}
    sonar.last=key;$('#sonarTxt').textContent=key==='big'?'Riesenfische hier!':key==='school'?'Fischschwarm hier!':'Suche Fische …';}
}

const QUIZ_GOAL=20,QUIZ_LUDINS=10,SCHEIN_LUDINS=100;
const quizOk=()=>state.quiz.ok.filter(id=>QUIZ_BY[id]);
function showQuiz(round){
  if(!round){ // 5 Fragen, zuerst die, die noch nicht richtig beantwortet sind
    const ok=quizOk(),mix=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
    const qs=mix(QUIZ.filter(q=>!ok.includes(q.id))).concat(mix(QUIZ.filter(q=>ok.includes(q.id)))).slice(0,5);
    round={qs:qs.map(q=>q.id),i:0,right:0,ludins:0};}
  openModal();card.className='card quiz';card.innerHTML='';
  const head=el('div','rosa');const face=el('div','face tiago');face.appendChild(el('div','beard'));head.appendChild(face);
  if(round.i>=round.qs.length){ // Ende der Runde
    head.appendChild(el('div',null,'<h2>Angel-Quiz</h2><p>'+round.right+' von '+round.qs.length+' richtig!'+(round.ludins?' Du bekommst <b>+'+round.ludins+' Ludins</b>.':'')+'</p>'));
    card.appendChild(head);
    const n=quizOk().length;
    if(!state.angelschein&&n>=QUIZ_GOAL){state.angelschein=true;state.ludins+=SCHEIN_LUDINS;save();refreshHud(true);sfxCatch();
      card.appendChild(el('div','schein','<div class="sico">🎓</div><b>Junior-Angelschein</b><span>für '+esc(state.avatar.name||'Angler')+'</span><p>Du kennst dich mit Fischen, Wasser und Natur aus. Opa Tiago ist stolz auf dich!</p><p><b>+'+SCHEIN_LUDINS+' Ludins</b></p>'));}
    else if(!state.angelschein)card.appendChild(el('p',null,'Für den <b>Junior-Angelschein</b> brauchst du '+QUIZ_GOAL+' richtige Fragen. Du hast schon '+n+'.'));
    else card.appendChild(el('p',null,'🎓 Du hast den Junior-Angelschein! Spiel trotzdem gern weiter.'));
    const bt=el('div','btns');const again=el('button','b go','Noch eine Runde');again.onclick=()=>showQuiz();
    const back=el('button','b alt','Zurück zum Laden');back.onclick=showTiago;bt.append(again,back);card.appendChild(bt);return;}
  const q=QUIZ_BY[round.qs[round.i]];
  head.appendChild(el('div',null,'<h2>Angel-Quiz</h2><p>Frage '+(round.i+1)+' von '+round.qs.length+' · '+q.k+'</p>'));
  card.appendChild(head);
  card.appendChild(el('p','qq',esc(q.q)));
  const box=el('div','btns col');
  const answers=[q.a].concat(q.w).map(t=>[Math.random(),t]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  answers.forEach(t=>{const b=el('button','b alt qa',esc(t));b.onclick=()=>{
    if(box.dataset.done)return;box.dataset.done='1';const right=t===q.a;
    [...box.children].forEach(x=>{if(x.textContent===q.a)x.classList.add('right');});
    if(!right)b.classList.add('wrong');
    if(right){round.right++;tone(880,0.15,'triangle',0.15);
      if(!state.quiz.ok.includes(q.id)){state.quiz.ok.push(q.id);state.ludins+=QUIZ_LUDINS;round.ludins+=QUIZ_LUDINS;save();refreshHud(true);}}
    else tone(220,0.2,'sine',0.1);
    card.appendChild(el('p','qe',(right?'✅ Richtig! ':'Nicht ganz. ')+esc(q.e)));
    const nx=el('button','b go','Weiter');nx.onclick=()=>{round.i++;showQuiz(round);};const bt=el('div','btns');bt.appendChild(nx);card.appendChild(bt);};
    box.appendChild(b);});
  card.appendChild(box);
}

let ctxAction=null,exitSpot=null;
function findExit(){
  for(const r of[2.5,3.5,4.5,5.5])for(let i=0;i<16;i++){const a=i/16*Math.PI*2,x=player.pos.x+Math.sin(a)*r,z=player.pos.z+Math.cos(a)*r;
    if(inBounds(x,z)&&(onDock(x,z)||onPlot(x,z)||heightAt(x,z)>0.3)&&!hitsCollider(x,z,0.4)&&!hitsWall(x,z,0.4))return {x,z};}
  return null;
}
function updateCtx(){
  let a=null;const p=player.pos;
  if(!player.inBoat){
    if(Math.hypot(p.x-ROSA.x,p.z-ROSA.z)<4.2)a='shop';
    else if(Math.hypot(p.x-TIAGO_AT.x,p.z-TIAGO_AT.z)<4.2)a='tiago';
    else if(infoNear())a='info';
    else if(planeNear())a='fly';
    else if(trapNear())a='trap';
    else if(onPlot(p.x,p.z))a='build';
    else if(state.hasBoat&&Math.hypot(p.x-boat.pos.x,p.z-boat.pos.z)<BOAT_REACH+(state.hasYacht?3:0))a='board';
  }else{exitSpot=findExit();if(exitSpot)a='exit';else if(trapNear())a='trap';}

  if(state.bucket.length>=bucketMax())return atLake()||atDE()?'Dein Eimer ist voll! Flieg zurück zum Amazonas und verkaufe die Fische bei Rosa.':'Dein Eimer ist voll! Bring die Fische zu Rosa an die Hütte.';
  if(atLake()&&!Object.keys(state.book).some(id=>FISH_BY[id]&&fishHome(FISH_BY[id])==='see'))return 'Lauf über den Steg bis ans Wasser und wirf die Angel aus!';
  if(atDE()&&curSpot){const p=prog(curSpot.id);
    if(!p.s)return p.f.length<STAMP_FISH?'Fluss-Stempel: Fang hier '+STAMP_FISH+' Fischarten ('+p.f.length+' von '+STAMP_FISH+') und lies die Infotafel.':'Super! Jetzt noch das Rätsel an der Infotafel lösen.';
    const nx=linksOf(curSpot.id).map(k=>SPOTS_BY[k.to]).find(x=>!stamped(x.id));if(nx)return 'Du hast den Stempel! Mit dem Flugzeug kannst du weiter, zum Beispiel: '+nx.name+'.';}
  if(!state.visitedLake&&found>=5)return 'Neben dem Dorf steht ein Flugzeug. Damit fliegst du zum Heimat-See!';
  if(state.visitedLake&&!Object.keys(state.fluss).length&&found>=8&&!atDE())return 'Neu: Mit dem Flugzeug fliegst du zu Flüssen in Deutschland!';
  if(!state.metTiago&&state.ludins>=40)return 'Neu: Opa Tiago hat einen Angelladen neben Rosas Hütte!';
  if(state.metTiago&&!state.builtOnce&&state.ludins>=20)return 'Hinter Opa Tiagos Hütte ist am Fluss ein Bauplatz für dein eigenes Haus!';
  if(!state.hasBoat&&state.ludins>=300)return 'Du hast genug Ludins! Kauf dir bei Opa Tiago ein Boot.';
  if(!state.hasBoat&&state.bucket.length>=4)return 'Verkaufe deine Fische bei Rosa. Für 300 Ludins gibt es bei Opa Tiago ein Boot!';
  if(state.hasBoat&&!state.usedBoat)return 'Dein Boot liegt am Steg. Geh hin und steig ein!';
  if(player.inBoat&&state.hasSonar&&!state.sonarFound)return 'Fahr langsam herum, bis das Echolot piept!';
  if(state.hasBoat&&!state.hasSonar&&state.ludins>=200)return 'Mit einem Echolot findest du die Fische. Opa Tiago hat eins für 200 Ludins!';
  if(state.hasBoat&&!state.hasYacht&&state.ludins>=YACHT.price)return 'Du hast genug Ludins für eine Yacht! Schau bei Opa Tiago unter „Boot“.';
  if(state.hasBoat&&!state.hasMotor&&state.ludins>=600)return 'Du hast genug Ludins! Bei Opa Tiago gibt es ein Motorboot.';
  if(state.traps.some(t=>trapFishCount(t)>=REUSE.full))return 'Eine Reuse ist voll! Die Boje ist grün. Hol die Fische ab.';
  if(state.metTiago&&!reusenAll()&&state.ludins>=150)return 'Neu bei Opa Tiago: eine Reuse! Die fängt Fische, während du etwas anderes machst.';
  if(found>=FISH.length)return 'Wow! Du hast alle '+FISH.length+' Fischarten gefunden!';
  return '';
}

/* ---- Spielstand sichern ----
   Das Spiel speichert von selbst. Für ganz sicher gibt es eine Sicherheitskopie als Datei (ohne Code).
   Laden geht mit der Datei oder mit einem alten Spielstand-Code. Geladenes kommt als neuer Spieler dazu. */
function readBackup(text){text=String(text||'').trim();
  if(text.indexOf(CODE_PREFIX)===0)return readSaveCode(text);
  const o=parseSave(text),s=o&&o.app==='amazonas-angler'?o.state:o;
  return isObj(s)&&isObj(s.avatar)?s:null;}
function saveBackupFile(){
  const day=new Date().toISOString().slice(0,10),who=(state.avatar.name||'Angler').replace(/[^0-9A-Za-zÄÖÜäöüß-]+/g,'_');
  const text=JSON.stringify({app:'amazonas-angler',gespeichert:new Date().toISOString(),state});
  const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  const a=el('a');a.href=url;a.download='Amazonas-Angler-'+who+'-'+day+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast('Gespeichert! Die Datei liegt in der App „Dateien“ unter „Downloads“.');}
function showSaveCode(confirmCode){
  openModal();card.className='card';card.innerHTML='';
  card.appendChild(el('h2',null,'Spielstand sichern'));
  if(confirmCode){
    const s=confirmCode;
    const keep=!emptyPlayer(state);

      (keep?'<br>Er kommt als neuer Spieler dazu. Dein jetziger Spielstand bleibt erhalten.':'')));
    const bt=el('div','btns');
    const yes=el('button','b go','Ja, laden');yes.onclick=()=>{
      lsSet(KEY+'-vor-code',JSON.stringify(state)); // den alten Stand trotzdem aufheben
      switchPlayer(keep?newPlayerId():state.playerId,JSON.stringify(s));};
    const no=el('button','b alt','Abbrechen');no.onclick=()=>showSaveCode();
    bt.append(yes,no);card.appendChild(bt);return;
  }
  card.appendChild(el('p','saveok',save()?'✅ Dein Spiel speichert von selbst. Gerade eben gespeichert!':'⚠️ Hier kann das Spiel nicht speichern. Bitte nicht im privaten Modus spielen.'));
  card.appendChild(el('p',null,'Für ganz sicher: Speichere eine <b>Sicherheitskopie</b> auf dem iPad. Damit holst du dein Spiel zurück, auch auf einem anderen Gerät.'));
  const err=el('p','err');err.hidden=true;
  const fail=t=>{err.textContent=t;err.hidden=false;};
  const bt=el('div','btns col');
  const sv=el('button','b go','💾 Sicherheitskopie speichern');sv.id='btnBackupSave';sv.onclick=()=>{err.hidden=true;saveBackupFile();};
  const file=el('input');file.type='file';file.accept='.json,application/json,text/plain';file.id='backupFile';file.hidden=true;
  file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;
    f.text().then(t=>{const s=readBackup(t);if(s)showSaveCode(s);else fail('Diese Datei ist keine Sicherheitskopie vom Amazonas Angler.');},
      ()=>fail('Die Datei konnte nicht gelesen werden.'));};
  const ld=el('button','b','📂 Sicherheitskopie laden');ld.id='btnBackupLoad';ld.onclick=()=>{err.hidden=true;file.click();};
  bt.append(sv,ld,file);card.appendChild(bt);card.appendChild(err);
  // Wer früher einen Code aufgeschrieben hat, kann ihn hier noch laden
  const old=el('button','b alt','Ich habe noch einen alten Code');old.id='btnOldCode';
  old.onclick=()=>{old.remove();

    inp.style.cssText='width:100%;box-sizing:border-box;font:13px ui-monospace,Menlo,monospace;border:3px solid var(--ink);border-radius:12px;padding:8px;background:#fff;color:var(--ink)';

      if(s)showSaveCode(s);else fail(inp.value.trim()?'Dieser Code passt nicht. Kopiere ihn bitte noch einmal ganz.':'Füge zuerst einen Code ein.');};
    rest.before(inp,lc);inp.focus();};

  const rest=el('div','btns');rest.append(old,cl);card.appendChild(rest);
}

/* ---- Spielzeit: Erwachsene stellen ein, wie lange man pro Tag spielt ----
   Einstellung fürs ganze Gerät in TIME_KEY, die gespielte Zeit pro Spieler in state.playTime (wird jeden Tag neu). */
const TIME_KEY=KEY+'-spielzeit',TIME_OPTS=[0,15,30,45,60,90];
const TIME_DEFAULT=15; // ohne Einstellung: 15 Minuten pro Tag
const timeSet=parseSave(lsGet(TIME_KEY))||{min:TIME_DEFAULT};if(!TIME_OPTS.includes(timeSet.min))timeSet.min=TIME_DEFAULT;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function playTimeToday(){const p=state.playTime;
  if(!isObj(p)||p.day!==today())state.playTime={day:today(),sec:0,extra:0};
  else{p.sec=Math.max(0,Number(p.sec)||0);p.extra=Math.max(0,Number(p.extra)||0);}
  return state.playTime;}
const timeLeft=()=>{if(!timeSet.min)return Infinity;const p=playTimeToday();return timeSet.min*60+p.extra-p.sec;};
const minText=m=>m===1?'1 Minute':m+' Minuten';
let timeWarned=false,timeLocked=false,timeBack='play',chipMin=-1;
function updateTimeChip(){const c=$('#timeChip'),left=timeLeft();c.hidden=!isFinite(left);if(c.hidden)return;
  const m=Math.max(0,Math.ceil(left/60));if(m===chipMin)return;chipMin=m;c.textContent='⏰ '+m+' Min';c.classList.toggle('low',m<=5);}
// Gezählt wird mit der echten Uhr (auch wenn das iPad ruckelt). Ist das Spiel im Hintergrund, zählt die Zeit nicht.
let lastTick=0;
function tickPlayTime(){
  const now=Date.now(),dt=lastTick?Math.min(1,(now-lastTick)/1000):0;lastTick=now;
  if(!timeSet.min||timeLocked||document.hidden||dt<=0)return;
  playTimeToday().sec+=dt;const left=timeLeft();
  if(left<=300&&left>0&&!timeWarned){timeWarned=true;toast('Noch 5 Minuten Spielzeit für heute.');}
  if(left<=0)lockTime();
  updateTimeChip();}

/* ---- Bestenliste: alle Spieler auf diesem iPad und die Rekord-Karten von Freunden ----
   Es gibt keinen Server. Eine Rekord-Karte ist eine kleine Datei (Spitzname, Ludins, Fänge).
   Erwachsene schicken sie sich selbst zu. Freunde-Karten liegen in FRIENDS_KEY und dürfen auch wieder weg. */
const FRIENDS_KEY=KEY+'-freunde';
function cleanCard(c){ // nur bekannte Fische und vernünftige Zahlen übernehmen
  if(!isObj(c)||typeof c.id!=='string'||!c.id)return null;
  const book={};if(isObj(c.book))for(const id in c.book){const b=c.book[id];if(FISH_BY[id]&&isObj(b))book[id]={n:Math.max(1,Math.round(Number(b.n)||1)),best:Math.max(0,Math.round(Number(b.best)||0))};}
  const col=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v)?v:'';
  return {id:c.id.slice(0,40),name:String(c.name||'Angler').slice(0,14),schein:c.schein===true,ludins:Math.min(1e7,Math.max(0,Math.round(Number(c.ludins)||0))),book,skin:col(c.skin),shirt:col(c.shirt),t:Number(c.t)||0};}

  return {app:'amazonas-angler-karte',v:1,id:state.cardId,name:state.avatar.name||'Angler',schein:state.angelschein,ludins:state.ludins,book:state.book,skin:state.avatar.skin,shirt:state.avatar.shirt,t:Date.now()};}

    return {name:(s.avatar&&s.avatar.name)||p.name||'Neuer Spieler',ludins:Math.round(Number(s.ludins)||0),book:isObj(s.book)?s.book:{},schein:s.angelschein===true,
      skin:(s.avatar&&s.avatar.skin)||p.skin,shirt:(s.avatar&&s.avatar.shirt)||p.shirt,me:p.id===state.playerId,here:true};})
    .filter(e=>e.name!=='Neuer Spieler'||e.ludins>0);

   Die Daten stecken unsichtbar im Bild (PNG-Textfeld), so kann man die Karte in der Bestenliste laden.

const CARD_KEYWORD='amazonas-angler-karte';
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  dv.setUint32(0,data.length);chunk.set([116,69,88,116],4);chunk.set(data,8);dv.setUint32(8+data.length,crc32(chunk.subarray(4,8+data.length)));

  out.set(b.subarray(0,at));out.set(chunk,at);out.set(b.subarray(at),at+chunk.length);return out;}
function pngReadText(b,key){const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);let p=8;
  while(p+12<=b.length){const len=dv.getUint32(p),type=String.fromCharCode(b[p+4],b[p+5],b[p+6],b[p+7]);
    if(type==='tEXt'){const d=b.subarray(p+8,p+8+len),z=d.indexOf(0);if(z>0&&new TextDecoder().decode(d.subarray(0,z))===key)return new TextDecoder().decode(d.subarray(z+1));}
    if(type==='IEND')break;p+=12+len;}
  return null;}

   Auf der Karte zeigt RECHTS nach Norden (flussaufwärts). So passt der lange Fluss quer auf den Bildschirm.
   Welt (x,z) -> Karte: nach rechts = +z, nach oben = +x (so ist die Karte nicht gespiegelt). */
const MAPC={land:'#6a9a4a',sand:'#d8c48a',water:'#3d93b8',me:'#e2412b'};
function hiDPI(cv,w,h){const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(w*d);cv.height=Math.round(h*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c;}
function mapMarkers(){const m=[
  {x:ROSA.x,z:ROSA.z,ico:'🐟',name:'Rosa'},{x:TIAGO_AT.x,z:TIAGO_AT.z,ico:'🎣',name:'Opa Tiago'},
  {x:(PLOT.x0+PLOT.x1)/2,z:(PLOT.z0+PLOT.z1)/2,ico:'🏠',name:state.builtOnce?'Dein Haus':'Bauplatz'}];
  PLANES.forEach(p=>{if(p.id!=='de'||deP)m.push({x:p.x,z:p.z,ico:'✈️',name:'Flugzeug'});});
  if(state.hasBoat&&!player.inBoat)m.push({x:boat.pos.x,z:boat.pos.z,ico:'🛶',name:'Dein Boot'});
  state.traps.forEach(t=>m.push({x:t.x,z:t.z,ico:'🧺',name:'Reuse',full:trapFishCount(t)>0}));
  return m;}
function drawIcon(c,ico,x,y,size,ring){if(ring){c.fillStyle=ring;c.beginPath();c.arc(x,y,size*0.62,0,7);c.fill();}
  c.font=size+'px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ico,x,y+1);}
// Du: ein roter Pfeil, der in deine Blickrichtung zeigt (ang = Winkel auf der Karte)
function drawMe(c,x,y,ang,r){c.save();c.translate(x,y);c.rotate(ang);
  c.fillStyle='#ffffff';c.beginPath();c.arc(0,0,r*1.15,0,7);c.fill();
  c.fillStyle=MAPC.me;c.strokeStyle='#1b2a20';c.lineWidth=2;c.beginPath();c.moveTo(r,0);c.lineTo(-r*0.7,-r*0.75);c.lineTo(-r*0.35,0);c.lineTo(-r*0.7,r*0.75);c.closePath();c.fill();c.stroke();c.restore();}
// Gelände auf eine Leinwand malen. toWorld(px,py) -> [x,z]
function paintTerrain(c,w,h,step,toWorld){c.fillStyle=MAPC.land;c.fillRect(0,0,w,h);
  for(let py=0;py<h;py+=step)for(let px=0;px<w;px+=step){const [x,z]=toWorld(px+step/2,py+step/2),hh=heightAt(x,z);
    if(hh<-0.35){c.fillStyle=MAPC.water;c.fillRect(px,py,step+0.5,step+0.5);}else if(hh<0.25){c.fillStyle=MAPC.sand;c.fillRect(px,py,step+0.5,step+0.5);}}}

  const w2s=(x,z)=>[S/2+(z-pz)*k,S/2-(x-px)*k];
  paintTerrain(c,S,S,4,(sx,sy)=>[px+(S/2-sy)/k,pz+(sx-S/2)/k]);
  for(const m of mapMarkers()){const [sx,sy]=w2s(m.x,m.z);if(Math.hypot(sx-S/2,sy-S/2)>S/2-8)continue;drawIcon(c,m.ico,sx,sy,15,m.full?'#2f9e5b':'rgba(251,243,223,.85)');}
  drawMe(c,S/2,S/2,-player.facing,9);

  const H=state.house;let changed=null;
  if(buildTool==='weg'){
    if(H.w[eKey]&&(Math.min(dh,dv)<0.3||!H.r[cKey])){state.ludins+=PARTS[H.w[eKey][0]].price;delete H.w[eKey];changed='-';}
    else if(H.r[cKey]){state.ludins+=PARTS.dach.price;delete H.r[cKey];changed='-';}
    else if(H.w[eKey]){state.ludins+=PARTS[H.w[eKey][0]].price;delete H.w[eKey];changed='-';}
  }else if(buildTool==='dach'){
    if(H.r[cKey])return;
    if(state.ludins<PARTS.dach.price){toast('Dafür fehlen dir noch '+(PARTS.dach.price-state.ludins)+' Ludins.');return;}
    state.ludins-=PARTS.dach.price;H.r[cKey]=1;changed='r'+cKey;
  }else{
    const old=H.w[eKey];if(old&&old[0]===buildTool&&old[1]===buildCol)return;
    const cost=PARTS[buildTool].price-(old?PARTS[old[0]].price:0);
    if(state.ludins<cost){toast('Dafür fehlen dir noch '+(cost-state.ludins)+' Ludins.');return;}
    state.ludins-=cost;H.w[eKey]=[buildTool,buildCol];changed=eKey;
  }
  if(!changed)return;
  if(changed!=='-'){state.builtOnce=true;tone(260,0.09,'square',0.05);tone(390,0.12,'square',0.05,0.07);}else tone(200,0.12,'triangle',0.08);
  save();rebuildHouse();renderBuildUI();
  if(changed!=='-'&&houseParts[changed])pops.push({o:houseParts[changed],t:0});
}

/* =================== Kamera & Schleife =================== */
const camTarget=new THREE.Vector3(),camWant=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
function updateCamera(dt){
  if(mode==='build'){const cx=PLOT.x0+PLOT.n*PLOT.c/2,cz=PLOT.z0+PLOT.n*PLOT.c/2,D=18,pt=0.98;
    camWant.set(cx+Math.sin(buildYaw)*Math.cos(pt)*D,PLOT.y+Math.sin(pt)*D,cz+Math.cos(buildYaw)*Math.cos(pt)*D);
    camera.position.lerp(camWant,1-Math.exp(-dt*8));camera.lookAt(cx,PLOT.y-1.2,cz);return;}
  if(mode==='creator'){
    creatorSpin+=dt*0.6;player.root.rotation.y=player.facing+Math.sin(creatorSpin)*0.6;
    const dx=Math.sin(player.facing),dz=Math.cos(player.facing);
    camera.position.set(player.pos.x+dx*3.6,player.y+1.5,player.pos.z+dz*3.6);
    camera.lookAt(player.pos.x,player.y+1.05,player.pos.z);
    const w=innerWidth,h=innerHeight,portrait=w<=720&&h>w;
    camera.setViewOffset(w,h,portrait?0:Math.min(410,w)/2,portrait?h*0.27:0,w,h);
    return;
  }
  camTarget.set(player.pos.x,player.y+1.6,player.pos.z);
  const cp=Math.cos(camPitch),d=player.inBoat?camDist+2:camDist;
  const cx=camTarget.x+Math.sin(camYaw)*cp*d,cz=camTarget.z+Math.cos(camYaw)*cp*d;
  let cy=camTarget.y+Math.sin(camPitch)*d;cy=Math.max(cy,Math.max(heightAt(cx,cz),0)+0.9);
  camWant.set(cx,cy,cz);camera.position.lerp(camWant,1-Math.exp(-dt*10));camera.lookAt(camTarget);
}
const clock=new THREE.Clock();let slowT=0,whereT=0,elapsed=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,clock.getDelta());elapsed+=dt;const t=elapsed;
  tickPlayTime();
  updateSonar(dt);
  const focusZ=mode==='build'?PLOT.z0:player.pos.z;updateChunks(focusZ,false);
  water.position.z=Math.round(focusZ/8)*8;{const fd=focusZ<DE.zone;scene.fog.near=fd?70:45;scene.fog.far=fd?260:150;} // am Fluss sieht man weiter
updateFoam(dt,t);updateTraps(t);updateDeShip(dt);rapidSound(player.pos.x,player.pos.z);
  if(mode==='play'){updatePlayer(dt,t);updateFishing(dt,t);
    slowT+=dt;if(slowT>0.2){slowT=0;updateCtx();updateTip();drawMini();}
    whereT+=dt;if(whereT>3){whereT=0;saveWhere();}}
  // Boot
  boat.mesh.visible=state.hasBoat;
  if(state.hasBoat){boat.mesh.position.set(boat.pos.x,BOAT_Y+Math.sin(t*2)*0.05,boat.pos.z);const rw=rapidAt(boat.pos.x,boat.pos.z);boat.mesh.rotation.set(Math.sin(t*1.7)*0.03+Math.sin(t*7)*0.05*rw,boat.yaw,Math.sin(t*2.1)*0.04+Math.sin(t*9)*0.07*rw);
    if(rw>0.3&&Math.random()<dt*6)wakePuff(boat.pos.x+(Math.random()-0.5)*3,boat.pos.z+(Math.random()-0.5)*4);}
  // Motorboot
  boat.motor.visible=state.hasMotor;boat.canoe.visible=!state.hasYacht;boat.yacht.visible=!!state.hasYacht;
  const fahrt=mode==='play'&&player.inBoat&&(state.hasMotor||state.hasYacht)?player.speed||0:0;
  const tuckern=mode==='play'&&player.inBoat&&(state.hasMotor||state.hasYacht);
  boat.prop.rotation.z+=dt*(tuckern?6+fahrt*30:0);
  if(fahrt>0.2){boat.mesh.rotation.x-=0.06*fahrt;wakeT+=dt;
    if(wakeT>0.05){wakeT=0;const back=state.hasYacht?3.6:3.1,bx=boat.pos.x-Math.sin(boat.yaw)*back,bz=boat.pos.z-Math.cos(boat.yaw)*back;
      wakePuff(bx+(Math.random()-0.5)*0.6,bz+(Math.random()-0.5)*0.6);}}
  for(const w of wake){if(!w.m.visible)continue;w.t+=dt;const sc=1+w.t*2.2;w.m.scale.set(sc,sc,sc);w.m.material.opacity=Math.max(0,0.7-w.t*0.7);if(w.t>1)w.m.visible=false;}
  engineSound(tuckern?0.15+fahrt*0.85:0);
  // Haus: im Baumodus Dach halb durchsichtig, steht man drin auch die Wände
  const inside=mode!=='build'&&!player.inBoat&&onPlot(player.pos.x,player.pos.z);
  roofMat.opacity=mode==='build'?0.4:inside?0.25:1;roofMat.depthWrite=roofMat.opacity===1;
  const wo=inside?0.45:1;wallMats.forEach(m=>{m.opacity=wo;m.depthWrite=wo===1;});postMat.opacity=wo;postMat.depthWrite=wo===1;
  for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.t+=dt/0.25;const k=Math.min(1,q.t)-1;q.o.scale.setScalar(0.6+0.4*(1+2.70158*k*k*k+1.70158*k*k)); // springt sanft auf seine Größe
    if(k>=1){q.o.scale.setScalar(1);pops.splice(i,1);}}
  // Rosa winkt
  rosa.arms[1].rotation.z=-0.3-Math.abs(Math.sin(t*2))*0.9;rosa.arms[1].rotation.x=-0.2;
  tiago.arms[1].rotation.z=-0.2-Math.abs(Math.sin(t*1.2))*0.6;tiago.rod.rotation.x=0.35+Math.sin(t*0.8)*0.08;
  mark.position.set(ROSA.x,heightAt(ROSA.x,ROSA.z)+2.8+Math.sin(t*3)*0.12,ROSA.z);mark.visible=state.bucket.length>0||mode==='creator';
  // Aras
  parrots.forEach(p=>{p.a+=p.sp*dt;const x=p.cx+Math.cos(p.a)*p.r,z=p.cz+Math.sin(p.a)*p.r;
    p.g.position.set(x,p.h+Math.sin(p.a*3)*1.5,z);const s=Math.sign(p.sp);p.g.rotation.y=Math.atan2(-Math.sin(p.a)*s,Math.cos(p.a)*s);
    const fl=Math.sin(t*11+p.r)*0.7;p.g.userData.wings[0].rotation.z=fl;p.g.userData.wings[1].rotation.z=-fl;});
  // Wasser
  waterTex.offset.x+=dt*0.004;waterTex.offset.y+=dt*0.012;
  // Ringe
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;const s=1+r.t*r.s*2;r.m.scale.set(s,s,s);r.m.material.opacity=Math.max(0,0.8-r.t*1.1);
    if(r.t>0.75){scene.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();rings.splice(i,1);}}
  // Springender Fisch
  if(jump.t<0){jump.next-=dt;if(jump.next<0&&mode!=='creator'){for(let k=0;k<12;k++){const a=Math.random()*6.28,d=7+Math.random()*16,x=player.pos.x+Math.sin(a)*d,z=player.pos.z+Math.cos(a)*d;
      if(heightAt(x,z)<-1.2){const b=Math.random()*6.28;Object.assign(jump,{t:0,x,z,dx:Math.sin(b),dz:Math.cos(b)});jumper.visible=true;splash(x,z);jumper.rotation.y=b;break;}}
      jump.next=4+Math.random()*6;}}
  else{jump.t+=dt/0.9;const k=jump.t;jumper.position.set(jump.x+jump.dx*k*2.2,Math.sin(Math.PI*k)*1.5-0.2,jump.z+jump.dz*k*2.2);jumper.rotation.x=-Math.cos(Math.PI*k)*0.9;
    if(k>=1){jumper.visible=false;splash(jumper.position.x,jumper.position.z);jump.t=-1;}}
  updateCamera(dt);
  renderer.render(scene,camera);
}
$('#loading').remove();
updateChunks(player.pos.z,true);
$('#creator').hidden=false;buildCreator();refreshHud();faceFreeSide();
if(askWhoPlays)showPlayers();
updateTimeChip();if(timeLeft()<=0)lockTime();
player.root.position.set(player.pos.x,player.y,player.pos.z);
loop();
})();
